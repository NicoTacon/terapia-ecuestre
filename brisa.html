  constructor(props){

      this._io=new IntersectionObserver((entries)=>{ entries.forEach((e)=>{ if(e.isIntersecting){ const p=e.target.play(); if(p&&p.catch) p.catch(()=>{}); } else { e.target.pause(); } }); },{threshold:0.4});

  startMusic(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    const ctx=new AC(); const vol=this.props.musicVolume ?? 0.22;
    const master=ctx.createGain(); master.gain.setValueAtTime(0,ctx.currentTime); master.gain.linearRampToValueAtTime(vol,ctx.currentTime+4);
    const len=ctx.sampleRate*3; const ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); } }
    const verb=ctx.createConvolver(); verb.buffer=ir;
    const wet=ctx.createGain(); wet.gain.value=0.6; const dry=ctx.createGain(); dry.gain.value=0.5;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
    lp.connect(dry); lp.connect(verb); verb.connect(wet); dry.connect(master); wet.connect(master); master.connect(ctx.destination);
    const mtof=(m)=>440*Math.pow(2,(m-69)/12);
    const chords=[[43,55,59,62,66],[40,55,59,62,64],[36,52,55,59,64],[38,54,57,62,64]];
    const pent=[74,76,79,81,83,86,88];
    let ci=0; const dur=8;
    const pad=(t)=>{ const ch=chords[ci%chords.length]; ci++;
      ch.forEach((m,k)=>{ ['sine','triangle'].forEach((type,j)=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.value=mtof(m); o.detune.value=j?6:-6; const g=ctx.createGain(); const peak=k===0?0.055:(type==='sine'?0.042:0.014); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+3); g.gain.linearRampToValueAtTime(0,t+dur+2.5); o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+2.7); }); }); };
    const chime=(t)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=mtof(pent[Math.floor(Math.random()*pent.length)]); const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.026,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+3.5); o.connect(g); g.connect(lp); o.start(t); o.stop(t+3.7); };
    let nextPad=ctx.currentTime+0.1, nextChime=ctx.currentTime+2;
    const tick=()=>{ while(nextPad<ctx.currentTime+1.5){ pad(nextPad); nextPad+=dur; } while(nextChime<ctx.currentTime+1.5){ chime(nextChime); nextChime+=1.6+Math.random()*3; } };
    tick(); this._timer=setInterval(tick,500);
    this._audio={ctx,master};
    return true;
  }
