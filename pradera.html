<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #4A4838">Es un acompañamiento desde el amor hacia una vida más consciente: una vida de aceptación y compromiso con uno mismo. Junto a los caballos aprendemos a escucharnos y a observarnos.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #4A4838">Se trata de abrazar no solo el cuerpo físico, sino también la mente y el alma. Conectar con las emociones y hacer un viaje hacia nuestro interior.</p>

<template data-for list="{{videos}}" as="v" hint-placeholder-count="6">

</div>
</template>
</div>
<div class="rtrack" aria-hidden="true"><span class="rthumb" ref="{{reelThumbRef}}"></span></div>
</div>
</div>
</section>

<section id="galeria" style="max-width: 1240px; margin: 0 auto; padding: 120px 24px; display: flex; flex-direction: column; gap: 48px">
<div class="rv" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; text-transform: uppercase; letter-spacing: .24em; font-size: 13px; font-weight: 600; color: #B5653A">Galería</p>
<h2 style="margin: 0; font-family: Fraunces, serif; font-weight: 300; font-size: clamp(34px, 4vw, 52px); line-height: 1.05">Postales de los encuentros</h2>
</div>
<p style="margin: 0; font-size: 15px; color: #6B6754">Tocá una foto para verla grande</p>
</div>
<div class="gal">
<template data-for list="{{featured}}" as="p" hint-placeholder-count="5">
<button class="ph" type="button" onClick="{{p.open}}" aria-label="Ver foto en grande">
<img src="{{p.src}}" alt="{{p.alt}}" loading="lazy" style="{{p.style}}">
</button>
</template>
</div>
<template data-if value="{{showAll}}" hint-placeholder-val="{{ false }}">
<div style="columns: 4 220px; column-gap: 16px">
<template data-for list="{{restPhotos}}" as="p" hint-placeholder-count="12">
<button class="ph" type="button" onClick="{{p.open}}" aria-label="Ver foto en grande" style="display: block; width: 100%; padding: 0; margin: 0 0 16px; border: 0; border-radius: 18px; background: #E6DDCB; break-inside: avoid">
<img src="{{p.src}}" alt="Foto de un encuentro de terapia ecuestre" loading="lazy" style="width: 100%; display: block">
</button>
</template>
</div>
</template>
<button class="btn" type="button" onClick="{{toggleAll}}" style="align-self: center; background: #3E5B3A; color: #FBF8F1; border: 0; padding: 16px 32px; border-radius: 999px; font: 600 16px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 10px">{{moreLabel}}</button>
</section>

      playing: playing,
      notPlaying: !playing,
      musicLabel: playing?'Pausar música':'Música tranquila',
      toggleMusic: ()=>{ if(this.state.playing){ this.stopMusic(false); this.setState({playing:false}); } else if(this.startMusic()){ this.setState({playing:true}); } },
      hasLightbox: !!this.state.lightbox,
      lightbox: this.state.lightbox,
      closeLightbox: ()=>this.setState({lightbox:null}),
      talleres: TALLERES,
      hasTalleres: TALLERES.length>0,
      noTalleres: TALLERES.length===0,
      formTitle: TALLERES.length?'Formulario de inscripción':'Dejá tus datos',
      formLead: TALLERES.length?'Completá tus datos y elegí el taller. Te confirmamos por WhatsApp.':'Cuando haya un taller nuevo, te avisamos por WhatsApp.',
      submitLabel: TALLERES.length?'Enviar inscripción':'Quiero que me avisen',
      sent: this.state.sent,
      notSent: !this.state.sent,
      sentTo: this.state.sentTo||'Yani',
      sentName: this.state.sentName,
      waUrl: this.state.waUrl,
      hasFormError: !!this.state.formError,
      formError: this.state.formError||'',
      waText: this.state.waText||'',
      sentPhone: this.state.sentPhone||'',
      copyLabel: this.state.copied?'¡Mensaje copiado!':'Copiar mensaje',
      copyMsg: ()=>{
        const txt=this.state.waText||''; const done=()=>this.setState({copied:true});
        const fallback=()=>{ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }catch(err){} };
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(fallback); } else { fallback(); }
      },
      submitForm: (e)=>{
        e.preventDefault();
        const form=(e.target&&e.target.closest)?e.target.closest('form'):null; if(!form) return;
        const fd=new FormData(form); const v=(k)=>String(fd.get(k)||'').trim();
        const faltan=[]; const req=[['nombre','Nombre y apellido'],['nacimiento','Fecha de nacimiento'],['dni','DNI'],['contacto','Contacto'],['lugar','De qué lugar sos'],['pais','País']];
        if(TALLERES.length) req.unshift(['taller','Taller']);
        req.forEach(([k,l])=>{ if(!v(k)) faltan.push(l); });
        if(faltan.length){ this.setState({formError:'Falta completar: '+faltan.join(', ')+'.'}); return; }
        if(!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v('nacimiento').replace(/[-.]/g,'/'))){ this.setState({formError:'Escribí la fecha de nacimiento así: dd/mm/aaaa (por ejemplo 05/12/1990).'}); return; }
        if(this.state.formError) this.setState({formError:''});
        const c=CONTACTOS[v('para')]||CONTACTOS.yani; const nac=v('nacimiento'); const nacTxt=nac.replace(/[-.]/g,'/');
        const lines=[TALLERES.length?('Hola '+c.nombre+'! Quiero anotarme en el taller: '+v('taller')):'Hola '+c.nombre+'! Quiero que me avises cuando haya un taller nuevo.','','Nombre: '+v('nombre'),'Fecha de nacimiento: '+nacTxt,'DNI: '+v('dni'),'Contacto: '+v('contacto'),'Lugar: '+v('lugar'),'País: '+v('pais')];
        const url='https://wa.me/'+c.numero+'?text='+encodeURIComponent(lines.join('\n'));
        try{ window.open(url,'_blank','noopener'); }catch(err){}
        this.setState({sent:true,copied:false,waText:lines.join('\n'),sentPhone:c.tel,sentTo:c.nombre,sentName:v('nombre').split(' ')[0]||'',waUrl:url});
      },
      resetForm: ()=>this.setState({sent:false,sentName:'',waUrl:'',waText:'',copied:false})
    };
  }
}
</script>
</body>
</html>
