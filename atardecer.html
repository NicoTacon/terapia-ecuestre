const FIRST_SHOWN=24;
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state={playing:false,showAll:false,lightbox:null,sent:false,sentName:'',waUrl:''};
    this.heroVideoRef=(el)=>{ if(el){ el.muted=true; el.defaultMuted=true; const p=el.play(); if(p&&p.catch) p.catch(()=>{}); } };
    this.autoRef=(el)=>{ if(!el) return; el.muted=true; el.defaultMuted=true; this.observer().observe(el); };
  }
  observer(){
    if(!this._io){
      this._io=new IntersectionObserver((entries)=>{ entries.forEach((e)=>{ if(e.isIntersecting){ const p=e.target.play(); if(p&&p.catch) p.catch(()=>{}); } else { e.target.pause(); } }); },{threshold:0.4});
    }
    return this._io;
  }
  componentWillUnmount(){ if(this._io) this._io.disconnect(); this.stopMusic(true); }
  startMusic(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    const ctx=new AC(); const vol=this.props.musicVolume ?? 0.22;
    const master=ctx.createGain(); master.gain.setValueAtTime(0,ctx.currentTime); master.gain.linearRampToValueAtTime(vol,ctx.currentTime+4);
    const len=ctx.sampleRate*4; const ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); } }
    const verb=ctx.createConvolver(); verb.buffer=ir;
    const wet=ctx.createGain(); wet.gain.value=0.75; const dry=ctx.createGain(); dry.gain.value=0.4;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=950;
    lp.connect(dry); lp.connect(verb); verb.connect(wet); dry.connect(master); wet.connect(master); master.connect(ctx.destination);
    const mtof=(m)=>440*Math.pow(2,(m-69)/12);
    const chords=[[38,53,57,60,64],[34,50,53,57,62],[41,53,57,60,65],[36,52,55,60,62]];
    const pent=[69,72,74,76,79,81,84];
    let ci=0; const dur=10;
    const pad=(t)=>{ const ch=chords[ci%chords.length]; ci++;
      ch.forEach((m,k)=>{ ['sine','triangle'].forEach((type,j)=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.value=mtof(m); o.detune.value=j?7:-7; const g=ctx.createGain(); const peak=k===0?0.06:(type==='sine'?0.045:0.014); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+4); g.gain.linearRampToValueAtTime(0,t+dur+3); o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+3.2); }); }); };
    const chime=(t)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=mtof(pent[Math.floor(Math.random()*pent.length)]); const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.028,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+4.5); o.connect(g); g.connect(lp); o.start(t); o.stop(t+4.7); };
    let nextPad=ctx.currentTime+0.1, nextChime=ctx.currentTime+3;
    const tick=()=>{ while(nextPad<ctx.currentTime+1.5){ pad(nextPad); nextPad+=dur; } while(nextChime<ctx.currentTime+1.5){ chime(nextChime); nextChime+=2.5+Math.random()*4; } };
    tick(); this._timer=setInterval(tick,500);
    this._audio={ctx,master};
    return true;
  }
  stopMusic(now){
    const a=this._audio; if(!a) return; this._audio=null;
    clearInterval(this._timer);
    const t=a.ctx.currentTime; a.master.gain.cancelScheduledValues(t); a.master.gain.setValueAtTime(a.master.gain.value,t); a.master.gain.linearRampToValueAtTime(0,t+(now?0.05:1.5));
    setTimeout(()=>{ a.ctx.close().catch(()=>{}); }, now?100:1700);
  }
  renderVals(){

        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(fallback); } else { fallback(); }
      },
      submitForm: (e)=>{
        e.preventDefault();
        const form=(e.target&&e.target.closest)?e.target.closest('form'):null; if(!form) return;
        const fd=new FormData(form); const v=(k)=>String(fd.get(k)||'').trim();
        const faltan=[]; const req=[['nombre','Nombre y apellido'],['nacimiento','Fecha de nacimiento'],['dni','DNI'],['contacto','Contacto'],['lugar','De qué lugar sos'],['pais','País']];
        if(TALLERES.length) req.unshift(['taller','Taller']);
        req.forEach(([k,l])=>{ if(!v(k)) faltan.push(l); });

        if(this.state.formError) this.setState({formError:''});
        const c=CONTACTOS[v('para')]||CONTACTOS.yani; const nac=v('nacimiento'); const nacTxt=nac.replace(/[-.]/g,'/');
        const lines=[TALLERES.length?('Hola '+c.nombre+'! Quiero anotarme en el taller: '+v('taller')):'Hola '+c.nombre+'! Quiero que me avises cuando haya un taller nuevo.','','Nombre: '+v('nombre'),'Fecha de nacimiento: '+nacTxt,'DNI: '+v('dni'),'Contacto: '+v('contacto'),'Lugar: '+v('lugar'),'País: '+v('pais')];
